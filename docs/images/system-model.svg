<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title description">
  <title id="title">Intropy System Model</title>
  <desc id="description">A system contains components, messages, and ports. Components publish and subscribe to messages, read and write through ports, and invoke services outside the system. Relationships depend on component kind.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1e293b">
    <rect x="20" y="20" width="710" height="440" fill="#f4f8fb" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="45" y="57" font-size="19" font-weight="600">System</text>
    <text x="45" y="80" font-size="14">Contains components, messages, and ports</text>

    <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M 250 210 L 480 125"/>
      <path d="M 250 260 L 480 375"/>
      <path d="M 250 240 L 800 240"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="352" y="135">publishes /</text>
      <text x="352" y="154">subscribes</text>
      <text x="352" y="341">reads / writes</text>
      <text x="520" y="226">calls</text>
    </g>

    <rect x="60" y="190" width="190" height="100" fill="#d9e8d2" stroke="#71856a"/>
    <rect x="480" y="80" width="210" height="90" fill="#f5dfc3" stroke="#a78b69"/>
    <rect x="480" y="330" width="210" height="90" fill="#f5dfc3" stroke="#a78b69"/>
    <rect x="800" y="190" width="210" height="100" fill="#d9e8d2" stroke="#71856a"/>

    <g text-anchor="middle">
      <text x="155" y="220" font-size="17" font-weight="600">Component</text>
      <text x="155" y="244" font-size="14">Extractor, loader, or</text>
      <text x="155" y="264" font-size="14">transactional integration</text>

      <text x="585" y="115" font-size="17" font-weight="600">Message</text>
      <text x="585" y="141" font-size="14">Payload contract + channel</text>

      <text x="585" y="365" font-size="17" font-weight="600">Port</text>
      <text x="585" y="391" font-size="14">Named external connection</text>

      <text x="905" y="226" font-size="17" font-weight="600">Service</text>
      <text x="905" y="252" font-size="14">Named external provider</text>
    </g>
  </g>
</svg>
